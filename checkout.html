<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BuzzBlock Checkout</title>

  <!-- Load Stripe.js FIRST so Stripe(...) exists when our script runs -->
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <h1>BuzzBlock Checkout (Test Mode)</h1>

  <p>MGID click ID: <span id="debug-mgid"></span></p>
  <p>BeMob click ID: <span id="debug-bemob"></span></p>

  <h2>Select your bundle</h2>
  <label>
    <input type="radio" name="bundle" value="1" checked>
    1× BuzzBlock – RM99
  </label><br>
  <label>
    <input type="radio" name="bundle" value="2">
    2× BuzzBlock – RM148
  </label><br>
  <label>
    <input type="radio" name="bundle" value="3">
    3× BuzzBlock – RM197
  </label>

  <h2>Your details (test; nothing real yet)</h2>
  <p>
    <label>Name:
      <input type="text" id="customer-name" placeholder="John Doe">
    </label>
  </p>
  <p>
    <label>Email:
      <input type="email" id="customer-email" placeholder="you@example.com">
    </label>
  </p>

  <h2>Payment</h2>
  <div id="checkout-container">
    <!-- Stripe Embedded Checkout will appear here -->
  </div>

  <button id="pay-button">Proceed to payment</button>

  <!-- Hidden fields for tracking -->
  <input type="hidden" id="mgid_clickid" name="mgid_clickid">
  <input type="hidden" id="bemob_clickid" name="bemob_clickid">

  <script>
    // 1) Read IDs from URL and store them
    (function() {
      var params = new URLSearchParams(window.location.search);
      var mgidClickId = params.get('mgid_clickid') || '';
      var bemobClickId = params.get('bemob_clickid') || '';

      document.getElementById('mgid_clickid').value = mgidClickId;
      document.getElementById('bemob_clickid').value = bemobClickId;

      document.getElementById('debug-mgid').textContent = mgidClickId || '(none)';
      document.getElementById('debug-bemob').textContent = bemobClickId || '(none)';

      window.BUZZBLOCK_TRACKING = {
        mgid_clickid: mgidClickId,
        bemob_clickid: bemobClickId
      };
    })();

    // 2) Stripe publishable key (TEST)
    const stripe = Stripe('pk_test_51RNA2WFPa06eKXlybOaIwB2wXQEt5nBUNDKR3rtEW0XXARlP7Q71nzQLAUAvfHQYoqgN3EQPctPOQpp860HONPXS00n1dHxhfB');

    let embeddedCheckout = null; // to prevent double-mounts

    document.getElementById('pay-button').addEventListener('click', async function() {
      // Prevent multiple clicks while loading
      const btn = this;
      btn.disabled = true;
      btn.textContent = 'Loading payment...';

      try {
        // Bundle selection
        const bundleInput = document.querySelector('input[name="bundle"]:checked');
        if (!bundleInput) {
          alert('Select a bundle first.');
          btn.disabled = false;
          btn.textContent = 'Proceed to payment';
          return;
        }
        const bundle = bundleInput.value;

        const tracking = window.BUZZBLOCK_TRACKING || {};
        const customer = {
          name: document.getElementById('customer-name').value || '',
          email: document.getElementById('customer-email').value || ''
        };

        // Call your backend to create a Checkout Session
        const response = await fetch('https://buzzblock-backend.onrender.com/create-session', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            bundle,
            tracking,
            customer3000
          })
        });

        const data = await response.json();

        if (!response.ok) {
          console.error('Server error:', data);
          alert('Server error: ' + (data.message || data.error || 'Unknown'));
          btn.disabled = false;
          btn.textContent = 'Proceed to payment';
          return;
        }

        const clientSecret = data.clientSecret;
        if (!clientSecret) {
          alert('No clientSecret returned from server.');
          btn.disabled = false;
          btn.textContent = 'Proceed to payment';
          return;
        }

        console.log('Received clientSecret:', clientSecret);

        // Initialize embedded checkout only once
        if (!embeddedCheckout) {
          embeddedCheckout = await stripe.initEmbeddedCheckout({ clientSecret });
          embeddedCheckout.mount('#checkout-container');
        } else {
          console.log('Embedded checkout already mounted');
        }

        btn.textContent = 'Payment form below';
      } catch (err) {
        console.error('Error calling /create-session or initializing Stripe:', err);
        alert('Error initializing payment. Check console.');
        btn.disabled = false;
        btn.textContent = 'Proceed to payment';
      }
    });
  </script>
</body>
</html>
