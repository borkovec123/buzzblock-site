<script>
  // --- 1) Pull tracking info from URL (MGID etc.) ---
  (function () {
    const params = new URLSearchParams(window.location.search);

    window.BUZZBLOCK_TRACKING = {
      mgid_clickid: params.get('mgid_clickid') || '',
      // add more if you ever need them
      // source_id: params.get('source_id') || '',
      // teaser_id: params.get('teaser_id') || '',
    };
  })();


  // --- 2) Stripe + backend setup ---
  const stripe = Stripe('pk_test_51RNA2WFPa06eKXlybOaIwB2wXQEt5nBUNDKR3rtEW0XXARlP7Q71nzQLAUAvfHQYoqgN3EQPctPOQpp860HONPXS00n1dHxhfB');

  // TODO: change this to your Render backend URL
  const BACKEND_URL = 'https://buzzblock-backend.onrender.com'; // example

  let embeddedCheckout = null;
  let currentBundle = null;
  let isInitializing = false;


  // --- 3) Create + mount embedded checkout for a given bundle ---
  async function initCheckoutForBundle(bundle) {
    if (!bundle) return;

    // Avoid pointless duplicate calls
    if (isInitializing && bundle === currentBundle) return;
    isInitializing = true;
    currentBundle = bundle;

    const container = document.getElementById('stripe-checkout');
    if (!container) {
      console.error('No #stripe-checkout element on page');
      isInitializing = false;
      return;
    }

    // Very simple loading state
    container.innerHTML = '<p>Loading secure payment form…</p>';

    // Tear down any previous session
    if (embeddedCheckout) {
      try {
        await embeddedCheckout.unmount();
      } catch (e) {
        console.warn('Error unmounting previous checkout', e);
      }
      embeddedCheckout = null;
    }

    const tracking = window.BUZZBLOCK_TRACKING || {};

    try {
      const res = await fetch(BACKEND_URL + '/create-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          bundle,          // "1" | "2" | "3" | "4" | "5"
          tracking         // { mgid_clickid: '...' }
          // If your backend wants customer info, you can add it here later
          // customer: { name: ..., email: ... }
        })
      });

      const data = await res.json();

      if (!res.ok || !data.clientSecret) {
        console.error('Backend error when creating session:', data);
        container.innerHTML = '<p style="color:#c00;">Payment temporarily unavailable. Please try again.</p>';
        isInitializing = false;
        return;
      }

      embeddedCheckout = await stripe.initEmbeddedCheckout({
        clientSecret: data.clientSecret
      });

      await embeddedCheckout.mount('#stripe-checkout');
    } catch (err) {
      console.error('Error initializing embedded checkout:', err);
      container.innerHTML = '<p style="color:#c00;">Error connecting to payment server. Please refresh the page.</p>';
    } finally {
      isInitializing = false;
    }
  }


  // --- 4) Wire bundle radios → new sessions ---
  document.addEventListener('DOMContentLoaded', () => {
    const bundleInputs = document.querySelectorAll('input[name="bundle"]');

    // Initial bundle (default checked, e.g. 3-pack)
    const defaultBundleInput = document.querySelector('input[name="bundle"]:checked');
    if (defaultBundleInput) {
      initCheckoutForBundle(defaultBundleInput.value);
    }

    // When user changes bundle, re-create a session with the new amount
    bundleInputs.forEach(input => {
      input.addEventListener('change', () => {
        if (input.checked) {
          initCheckoutForBundle(input.value);
        }
      });
    });
  });
</script>
